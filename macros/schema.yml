version: 2

macros:
  - name: model
    description: |
      Top-level Sigma data model. Assembles composed tables into a single page and resolves `relationships` into the real Sigma shape (nested under each relationship's source table, referencing the target table's real element id) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-relationship. `page.id` is left `''`, since Sigma assigns it on creation. Strips internal-only fields (`key`, `_column_ids`) from each table before emitting.
    arguments:
      - name: name
        type: string
        description: Sigma data model name.
      - name: tables
        type: list
        description: List of `sigma_data_models.table(...)` specs that make up the data model's one page. Table `key`s must be unique within this call - a duplicate raises a compiler error, since `relationships` resolves `from`/`to` against them.
      - name: relationships
        type: list
        description: List of `sigma_data_models.relationship(...)` specs, or bare `(from, from_column, to, to_column)` tuples. Default `[]`. Each `from`/`to` must reference a `key` present in `tables`, and each `from_column`/`to_column` must be an actual column on that table - all four raise a compiler error otherwise.
      - name: page_name
        type: string
        description: Sigma page name. Defaults to `name`.
      - name: folder_id
        type: string
        description: Sigma folder id the data model document lives in. Defaults to the `sigma_folder_id` project var.
      - name: data_model_id
        type: string
        description: Existing Sigma data model id, for updating a previously-created model. No default - `none` (omitted) for a first-time create, where Sigma assigns one.

  - name: table
    description: |
      A Sigma table element bound to a warehouse relation (`source.kind = 'warehouse-table'`) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-single-table. Freezes the element id, and each of its columns'/metrics'/folders' ids, off the table's physical `database.schema.identifier`, lowercased (not `key` - `key` only needs to be unique within one `sigma_data_models.model()` call, so the same `key` can be reused across separate models without id collisions).
    arguments:
      - name: key
        type: string
        description: Local label for this table, used only to wire `relationships=[...]`/`folders=[...]` within the same `sigma_data_models.model()` call - it never appears in the emitted spec.
      - name: identifier
        type: string
        description: dbt model/relation name to bind to, and the default source table name used in auto-derived column formulas. Defaults to `key`.
      - name: database
        type: string
        description: Defaults to `target.database`.
      - name: schema
        type: string
        description: Defaults to `target.schema`.
      - name: connection_id
        type: string
        description: Sigma connection id for this table's `source`. Defaults to the `sigma_connection_id` project var.
      - name: columns
        type: list
        description: Bare column name strings and/or `sigma_data_models.column(...)` specs. Column names must be unique within a table; a duplicate raises a compiler error.
      - name: metrics
        type: list | dict
        description: "Either a dict mapping metric name to formula, or a list of `sigma_data_models.metric(...)` specs. Metric names must be unique within a table; a duplicate raises a compiler error. Omitted entirely from the emitted table when empty, rather than an empty list."
      - name: folders
        type: list
        description: List of `sigma_data_models.folder(...)` specs, grouping named subsets of `columns` for display - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-folder. Omitted entirely from the emitted table when empty.
      - name: filters
        type: list
        description: List of `sigma_data_models.filter(...)` specs. Omitted entirely from the emitted table when empty.

  - name: column
    description: |
      Normalizes a column into an intent descriptor; `sigma_data_models.table()` resolves it into the real Sigma column shape, since that requires table-level context (the identifier path for the id, the table's identifier for the default formula) this macro doesn't have. Leaving `formula` unset produces a passthrough column bound directly to the warehouse column (`{id, formula}`, no `name`); passing `formula` produces a calculated column (`{id, formula, name}`) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-calculated-column.
    arguments:
      - name: name
        type: string
        description: Column key, used to freeze its id and (for a passthrough column) as the column referenced in the default formula. Lowercased regardless of input casing.
      - name: formula
        type: string
        description: Sigma formula, e.g. `\"[Price] - [Cost]\"`. Unset for a passthrough column, whose formula instead defaults to `'[<identifier>/<Titleized name>]'`.
      - name: display_name
        type: string
        description: Sigma display name for a calculated column. Defaults to a title-cased version of `name`. Ignored for a passthrough column, which has no `name` field.

  - name: metric
    description: |
      Normalizes a metric into an intent descriptor; `sigma_data_models.table()` resolves it into the real Sigma metric shape (`{id, formula, name}`) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-metric. A plain dict entry (`{name: formula}`) in `sigma_data_models.table(metrics=...)` is sufficient when no `display_name` override is needed.
    arguments:
      - name: name
        type: string
        description: Metric key, used to freeze its id. Lowercased regardless of input casing.
      - name: formula
        type: string
        description: Sigma metric formula, e.g. `'CountDistinct([Account Guid])'`.
      - name: display_name
        type: string
        description: Sigma display name. Defaults to a title-cased version of `name`.

  - name: relationship
    description: |
      Normalizes a relationship into an intent descriptor; `sigma_data_models.model()` resolves it into the real Sigma shape (`{id, targetElementId, keys, name}`, nested inside the *source* table's element) once every table in the model has been composed - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-relationship. A bare `(from, from_column, to, to_column)` tuple is sufficient when no `name` override is needed. Note a Sigma relationship has no join type - it's a declared lineage link, not a row-blending join; Sigma's join concept (`source.kind = 'join'`) is a distinct element kind this package does not yet support.
    arguments:
      - name: from
        type: string
        description: Key of the source table (the one this relationship nests under).
      - name: from_column
        type: string
        description: Column name on the source table. Must be an actual column on that table, or `sigma_data_models.model()` raises a compiler error.
      - name: to
        type: string
        description: Key of the target table.
      - name: to_column
        type: string
        description: Column name on the target table. Must be an actual column on that table, or `sigma_data_models.model()` raises a compiler error.
      - name: name
        type: string
        description: Relationship display name.

  - name: folder
    description: |
      Normalizes a folder into an intent descriptor; `sigma_data_models.table()` resolves the member `columns` (by name) into the real Sigma folder shape (`{id, name, items}`, where `items` is the member columns' ids) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-folder. Each entry in `columns` must be an actual column on the same table, or `sigma_data_models.table()` raises a compiler error.
    arguments:
      - name: name
        type: string
        description: Folder display name.
      - name: columns
        type: list
        description: Column names to group under this folder.

  - name: filter
    description: |
      Normalizes a filter into an intent descriptor; `sigma_data_models.table()` resolves the `column` (by name) into the real Sigma filter shape (`{id, columnId, kind, ...}`, where `...` is `options` passed through verbatim) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-filters. `options` uses Sigma's own field names directly (e.g. `min`/`max` for `kind='number-range'`, `mode`/`values` for `kind='list'`, `mode`/`value`/`case` for `kind='text-match'`, plus optionally `includeNulls` on any kind), so there's no per-`kind` macro surface to keep in sync with Sigma's filter types.
    arguments:
      - name: column
        type: string
        description: Column name this filter targets. Must be an actual column on the same table, or `sigma_data_models.table()` raises a compiler error.
      - name: kind
        type: string
        description: Sigma filter kind, e.g. `'number-range'`/`'list'`/`'text-match'`.
      - name: options
        type: dict
        description: "Kind-specific fields, passed through verbatim using Sigma's own field names, e.g. `{'mode': 'include', 'values': ['Manufacturing']}`. Default `{}`."

  - name: materialize
    description: |
      Wires a composed `sigma_data_models.model(...)` spec into the dbt model's `config(meta=...)`, where it lands in `manifest.json` on `dbt parse`/`dbt compile`. Replaces `meta` wholesale rather than merging it - other `meta` keys set on the same model (directly or via `dbt_project.yml`) will be dropped.
    arguments:
      - name: spec
        type: dict
        description: The dict returned by `sigma_data_models.model(...)`.
      - name: materialized
        type: string
        description: Materialization for the underlying (inert) model. Default `'view'`.

  - name: freeze_id
    description: |
      Returns `local_md5(path)` for a stable path string. Same path in, same id out, on every compile — the id only changes if the underlying path (a table's `database.schema.identifier` for table/column/metric/folder/filter ids, or a relationship's `from`/`to`/`from_column`/`to_column`) is renamed. Used internally; not normally called directly.
    arguments:
      - name: path
        type: string
        description: Stable path string to hash, e.g. `'table:' ~ identifier_path`.

  - name: titleize
    description: |
      Converts `snake_case`/`kebab-case` strings to a title-cased display string, e.g. `account_guid` -> `Account Guid`. Used internally to derive default `display_name`s and passthrough-column formulas; not normally called directly.
    arguments:
      - name: value
        type: string
        description: String to title-case.
